  <rect class="region" x="375" y="1300" width="590" height="46"/>
  <text class="small" x="393" y="1329">aside / Baking note</text>
  <path class="line" d="M40 1372 H990"/>
  <text x="65" y="1403">Related recipe -&gt; Lemon Cookies</text>
  <text class="small" x="745" y="1403">footer / About + credits</text>

  <text class="label" x="1050" y="823">04 Recipe detail / Mobile</text>
  <rect class="frame" x="1050" y="845" width="390" height="578"/>
  <rect class="region" x="1050" y="845" width="390" height="83"/>
  <text class="brand" x="1070" y="880">Weekend Oven</text>
  <text x="1070" y="909">Home     Recipes     About</text>
  <text class="brand" x="1070" y="967">Chocolate Brownies</text>
  <text class="small" x="1070" y="992">Short introduction / main &gt; article</text>
  <text class="small" x="1070" y="1016">Jump to: Ingredients / Method</text>
  <use xlink:href="#photo" x="1070" y="1032" width="350" height="91"/>
  <rect class="region" x="1070" y="1139" width="350" height="74"/>
  <text class="label" x="1087" y="1167">Ingredients</text>
  <text class="small" x="1087" y="1194">section#ingredients / unordered list</text>
  <rect class="region" x="1070" y="1227" width="350" height="74"/>
  <text class="label" x="1087" y="1255">Method</text>
  <text class="small" x="1087" y="1282">section#method / numbered steps</text>
