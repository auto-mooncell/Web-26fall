  <text x="690" y="885">Home     Recipes     About</text>
  <text class="brand" x="65" y="949">Chocolate Brownies</text>
  <text x="65" y="978">A short introduction. main &gt; article</text>
  <text class="small" x="65" y="1005">Jump to: Ingredients (#ingredients) / Method (#method)</text>
  <use xlink:href="#photo" x="65" y="1025" width="900" height="140"/>
  <rect class="region" x="65" y="1186" width="285" height="160"/>
  <text class="label" x="83" y="1217">Ingredients</text>
  <text class="small" x="83" y="1243">section#ingredients / ul</text>
  <text x="83" y="1274">- Ingredient and amount</text>
  <text x="83" y="1304">- Ingredient and amount</text>
  <rect class="region" x="375" y="1186" width="590" height="99"/>
