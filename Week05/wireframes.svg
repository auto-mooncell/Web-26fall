  <path class="line" d="M1050 1372 H1440"/>
  <text class="small" x="1070" y="1395">Related recipe -&gt; Lemon Cookies</text>
  <text class="small" x="1070" y="1415">footer / About + credits</text>
  <text class="small" x="40" y="1464">Recipe reading order: title -&gt; jump links -&gt; photo -&gt; ingredients -&gt; method -&gt; note -&gt; related recipe.</text>
  <text class="small" x="40" y="1491">Boxes indicate structure only. The final recipe page will grow naturally with the full ingredient and step lists.</text>
</svg>
