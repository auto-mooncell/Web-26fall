  <line x1="1360" y1="844" x2="1710" y2="844" class="rule"/>
  <text x="1375" y="872" class="tag">&lt;footer&gt; Photo credits</text>
  <text x="40" y="941">Desktop: city previews and album photos beside each other. Phone: stack in one column.</text>
  <text x="40" y="979" class="small">HTML anchors link city sections. Shared navigation connects the three pages. All external photos receive credits.</text>
  <text x="40" y="1017" class="small">Boxes mark content regions, not decorative cards. Grey photo placeholders are not final images. Layouts are schematic, not to scale.</text>
</svg>
